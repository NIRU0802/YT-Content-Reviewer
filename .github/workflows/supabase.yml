name: Deploy Supabase Database

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.205.0
          
      - name: Log in to Supabase
        run: |
          echo "${{ secrets.SUPABASE_ACCESS_TOKEN }}" | supabase login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          
      - name: Link to Supabase project
        run: |
          supabase link --project-ref qjkicgyphdqhuazmqfkx
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          
      - name: Push database schema
        run: supabase db push
        
      - name: Verify deployment
        run: |
          supabase db query "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public';"
          
      - name: Show tables
        run: |
          echo "Tables created:"
          supabase db query "SELECT COUNT(*) as table_count FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';"